<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    
    <!-- PWA & iOS Native feel -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Resu 2026" />
    
    <!-- SEO Optimization -->
    <title>Resurrection Fest 2026 - Agenda de Conciertos</title>
    <meta name="description" content="Agenda y horarios interactivos del festival Resurrection Fest 2026. Filtra por escenarios, organiza tus bandas favoritas y consulta el cartel sin conexión." />
    
    <!-- GTM/Crawler hints -->
    <meta name="robots" content="index, follow" />
    <script type="module" crossorigin src="./assets/index-Da2_hugq.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DZVGsUsB.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((reg) => {
              console.log('Service Worker registrado con éxito:', reg.scope);
            })
            .catch((err) => {
              console.error('Error al registrar el Service Worker:', err);
            });
        });

        // Ensure we reload the page when a new service worker takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
  </body>
</html>
